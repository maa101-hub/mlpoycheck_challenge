# Render Blueprint for the Mploycheck backend API.
# Docs: https://render.com/docs/blueprint-spec
#
# You can either use this blueprint (New + "Blueprint" in the Render dashboard,
# pointed at this repo) or configure a Web Service manually with the same
# Root Directory / Build / Start commands and env vars below.
services:
  - type: web
    name: mploycheck-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Neon Postgres connection string. Add its value in the Render dashboard
      # (marked sync:false so it is not stored in the repo).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # A strong random secret is generated by Render for JWT signing.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Set this to your Vercel frontend URL after the frontend is deployed,
      # e.g. https://your-app.vercel.app  (comma-separate multiple origins).
      - key: CORS_ORIGINS
        sync: false
      - key: API_DELAY
        value: "1500"
      - key: NODE_VERSION
        value: "20"
