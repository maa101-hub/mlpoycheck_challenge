<div class="flex min-h-screen bg-[#f8f9fb]">
  <app-sidebar></app-sidebar>
  <div class="flex-1 ml-[220px] flex flex-col">
    <app-topbar></app-topbar>
    <main class="flex-1 p-7 overflow-y-auto">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">Access Requests</h1>
        <p class="text-gray-500 text-sm mt-1.5">Approve or reject employees requesting to join your company.</p>
      </div>

      <!-- Filter tabs -->
      <div class="inline-flex gap-1 p-1 bg-gray-100 rounded-xl mb-5">
        <button (click)="setFilter('pending')" [class]="filter === 'pending' ? 'px-4 py-2 rounded-lg bg-white text-primary-700 text-sm font-semibold shadow-sm' : 'px-4 py-2 rounded-lg text-gray-500 text-sm font-medium hover:text-gray-700'">Pending</button>
        <button (click)="setFilter('approved')" [class]="filter === 'approved' ? 'px-4 py-2 rounded-lg bg-white text-primary-700 text-sm font-semibold shadow-sm' : 'px-4 py-2 rounded-lg text-gray-500 text-sm font-medium hover:text-gray-700'">Approved</button>
        <button (click)="setFilter('rejected')" [class]="filter === 'rejected' ? 'px-4 py-2 rounded-lg bg-white text-primary-700 text-sm font-semibold shadow-sm' : 'px-4 py-2 rounded-lg text-gray-500 text-sm font-medium hover:text-gray-700'">Rejected</button>
      </div>

      <!-- Feedback -->
      <div *ngIf="actionSuccess" class="mb-4 p-3 rounded-xl bg-emerald-50 ring-1 ring-emerald-200/60 text-sm text-emerald-700 font-medium">{{ actionSuccess }}</div>
      <div *ngIf="actionError" class="mb-4 p-3 rounded-xl bg-red-50 ring-1 ring-red-200/60 text-sm text-red-700 font-medium">{{ actionError }}</div>

      <!-- Loading -->
      <div *ngIf="isLoading" class="flex flex-col items-center justify-center h-[40vh] gap-4">
        <div class="w-10 h-10 border-[3px] border-primary-200 border-t-primary-700 rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500 font-medium">Loading requests...</p>
      </div>

      <div *ngIf="!isLoading">
        <!-- Empty -->
        <div *ngIf="requests.length === 0" class="bg-white rounded-[1.5rem] p-12 ring-1 ring-black/[0.04] text-center">
          <p class="text-gray-500 text-sm">No {{ filter }} requests.</p>
        </div>

        <!-- Table -->
        <div *ngIf="requests.length > 0" class="bg-white/70 rounded-[1.5rem] p-1.5 ring-1 ring-black/[0.04]">
          <div class="bg-white rounded-[calc(1.5rem-0.375rem)] p-6">
            <table class="w-full">
              <thead>
                <tr class="border-b border-gray-100">
                  <th class="text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wider pb-4">Employee</th>
                  <th class="text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wider pb-4">Email</th>
                  <th class="text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wider pb-4">Status</th>
                  <th class="text-right text-[11px] font-semibold text-gray-400 uppercase tracking-wider pb-4">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let r of requests" class="border-b border-gray-50 last:border-0 hover:bg-gray-50/50 transition-colors duration-300">
                  <td class="py-4">
                    <div class="flex items-center gap-3">
                      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-600 to-primary-800 flex items-center justify-center flex-shrink-0"><span class="text-white text-xs font-bold">{{ initials(r.fullName) }}</span></div>
                      <span class="text-sm font-medium text-gray-800">{{ r.fullName }}</span>
                    </div>
                  </td>
                  <td class="py-4"><span class="text-sm text-gray-500">{{ r.email }}</span></td>
                  <td class="py-4"><span [class]="'inline-flex px-2.5 py-1 rounded-full text-[11px] font-semibold capitalize ' + getStatusClass(r.status)">{{ r.status }}</span></td>
                  <td class="py-4 text-right">
                    <div class="inline-flex items-center gap-2 justify-end">
                      <button *ngIf="r.status !== 'approved'" (click)="approve(r)" [disabled]="busyId === r.id"
                        class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50">Approve</button>
                      <button *ngIf="r.status !== 'rejected'" (click)="reject(r)" [disabled]="busyId === r.id"
                        class="px-3 py-1.5 rounded-lg border border-gray-200 text-gray-700 text-xs font-semibold hover:bg-gray-50 transition-colors disabled:opacity-50">Reject</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
