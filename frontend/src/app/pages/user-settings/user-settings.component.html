<div class="flex min-h-screen bg-[#f8f9fb]">
  <aside class="fixed left-0 top-0 h-screen w-[200px] bg-white border-r border-gray-100 flex flex-col z-40">
    <div class="px-5 pt-6 pb-4 flex items-center gap-2.5"><img src="assets/image1.png" alt="Mploycheck" class="w-8 h-8 rounded-lg object-contain flex-shrink-0"><div><span class="text-base font-bold text-primary-700 tracking-tight block leading-tight">Mploycheck</span><span class="text-[10px] text-gray-400 font-medium">Verification Secure</span></div></div>
    <nav class="flex-1 px-3 mt-4">
      <ul class="space-y-1">
        <li><button (click)="navigateTo('/user-overview')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 font-medium text-sm transition-all duration-500">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6z"/></svg>
          Overview</button></li>
        <li><button (click)="navigateTo('/user-verifications')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 font-medium text-sm transition-all duration-500">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
          Verifications</button></li>
        <li><button (click)="navigateTo('/user-profile')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 font-medium text-sm transition-all duration-500">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
          Documents</button></li>
        <li><button class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl bg-primary-700 text-white font-medium text-sm">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247"/></svg>
          Settings</button></li>
      </ul>
    </nav>
    <div class="px-3 pb-4 space-y-2">
      <button (click)="navigateTo('/user-profile')" class="w-full flex items-center justify-center gap-2 bg-primary-700 text-white py-3 rounded-xl font-semibold text-sm hover:bg-primary-800 transition-all">Upload Document</button>
      <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-2 text-gray-500 text-sm font-medium hover:text-red-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
        Logout</button>
    </div>
  </aside>

  <div class="flex-1 ml-[200px] flex flex-col">
    <header class="h-14 bg-white border-b border-gray-100 flex items-center justify-between px-6">
      <span class="flex items-center gap-2"><img src="assets/image1.png" alt="Mploycheck" class="w-6 h-6 rounded object-contain"><span class="text-base font-bold text-primary-700 tracking-tight">Mploycheck</span></span>
      <div class="flex items-center gap-6">
        <button (click)="navigateTo('/user-overview')" class="text-sm text-gray-500 font-medium hover:text-gray-900 transition-colors">Dashboard</button>
        <button (click)="navigateTo('/user-verifications')" class="text-sm text-gray-500 font-medium hover:text-gray-900 transition-colors">My Progress</button>
        <button (click)="navigateTo('/user-profile')" class="text-sm text-gray-500 font-medium hover:text-gray-900 transition-colors">Profile</button>
        <span class="text-sm font-semibold text-gray-900 border-b-2 border-primary-700 pb-0.5">Security</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-600 to-primary-800 flex items-center justify-center"><span class="text-white text-xs font-bold">J</span></div>
      </div>
    </header>

    <main class="flex-1 p-7 overflow-y-auto">
      <div *ngIf="isLoading" class="flex flex-col items-center justify-center h-[60vh] gap-4">
        <div class="w-10 h-10 border-[3px] border-primary-200 border-t-primary-700 rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500 font-medium">Loading security settings...</p>
      </div>
      <div *ngIf="!isLoading">
        <div class="mb-8">
          <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">Security</h1>
          <p class="text-gray-500 text-sm mt-1.5">Manage your account password.</p>
        </div>

        <div class="grid grid-cols-12 gap-6">
          <div class="col-span-12 lg:col-span-8 lg:col-start-3">
            <!-- Password -->
            <div class="bg-white/70 rounded-[1.5rem] p-1.5 ring-1 ring-black/[0.04] mb-6">
              <div class="bg-white rounded-[calc(1.5rem-0.375rem)] p-6">
                <h2 class="text-base font-bold text-gray-900 tracking-tight mb-5">Change Password</h2>
                <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()">
                <div class="space-y-4">
                  <div><label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label><input type="password" formControlName="currentPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all duration-300"></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-2">New Password</label><input type="password" formControlName="newPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all duration-300"></div>
                  <div><label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label><input type="password" formControlName="confirmPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all duration-300"></div>
                  <div *ngIf="passwordSuccess" class="p-3 rounded-xl bg-emerald-50 ring-1 ring-emerald-200/60 text-sm text-emerald-700 font-medium">{{ passwordSuccess }}</div>
                  <div *ngIf="passwordError" class="p-3 rounded-xl bg-red-50 ring-1 ring-red-200/60 text-sm text-red-700 font-medium">{{ passwordError }}</div>
                  <button type="submit" [disabled]="isSaving" class="px-6 py-3 rounded-xl bg-primary-700 text-white text-sm font-semibold hover:bg-primary-800 active:scale-[0.98] transition-all duration-500 mt-2 disabled:opacity-60">{{ isSaving ? 'Updating...' : 'Update Password' }}</button>
                </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
